name: Update model data

on:
  schedule:
    - cron: "0 13 * * 2"    # Tue  8 AM ET  – stats only (props usually aren't posted yet)
    - cron: "0 15 * * 4"    # Thu 10 AM ET  – stats + props
    - cron: "0 15 * * 6"    # Sat 10 AM ET  – stats + props
    - cron: "30 15 * * 0"   # Sun 10:30 AM ET – stats + props (final injury reports)
  workflow_dispatch:
    inputs:
      fetch_odds:
        description: "Pull sportsbook props (about 1 Odds API credit per game)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check repo layout
        run: |
          missing=0
          for f in requirements.txt scripts/build_data.py index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing '$f' at the top level of the repo. Upload it (keep the folder name for scripts/)."
              missing=1
            fi
          done
          echo "Files found in repo:"; find . -path ./.git -prune -o -type f -print | sort
          exit $missing

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data/data.json
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FETCH_ODDS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.fetch_odds) || (github.event_name == 'schedule' && github.event.schedule != '0 13 * * 2')) && '1' || '0' }}
        run: python scripts/build_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update model data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $i failed, retrying..."; sleep 5
          done
          echo "::error::Could not push data. Check Settings > Actions > General > Workflow permissions = 'Read and write permissions'."
          exit 1
